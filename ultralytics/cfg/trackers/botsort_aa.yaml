tracker_type: botsort

# AA confidence is p_cls * p_AA. Admit weak observations for recovery while
# requiring at least 0.05 for first-stage association and track creation.
track_high_thresh: 0.05
track_low_thresh: 0.001
new_track_thresh: 0.05
track_buffer: 30
match_thresh: 0.8
fuse_score: false

gmc_method: sparseOptFlow
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: false

min_box_area: 10
